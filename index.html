<!DOCTYPE html> 
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gilmore Girls Trivia Night</title>
  <style>
    :root {
      --cream: #fff5df;
      --paper: #fffaf0;
      --latte: #dfc49a;
      --caramel: #b9793f;
      --pumpkin: #d97935;
      --marigold: #efb644;
      --coffee: #4d2f22;
      --ink: #26364b;
      --blue: #193657;
      --leaf: #7c8d54;
      --red: #9e4435;
      --shadow: rgba(43, 29, 22, 0.16);
      --glow: rgba(239, 182, 68, 0.45);
      --radius: 8px;
    }

    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      min-height: 100vh;
      margin: 0;
      color: var(--coffee);
      font-family: Georgia, "Times New Roman", serif;
      background:
        radial-gradient(circle at 16px 18px, rgba(185, 121, 63, 0.14) 0 3px, transparent 4px),
        radial-gradient(circle at 78px 56px, rgba(239, 182, 68, 0.18) 0 4px, transparent 5px),
        linear-gradient(135deg, transparent 0 46%, rgba(124, 141, 84, 0.12) 47% 53%, transparent 54%),
        linear-gradient(45deg, transparent 0 47%, rgba(158, 68, 53, 0.1) 48% 52%, transparent 53%),
        var(--cream);
      background-size: 112px 112px, 112px 112px, 88px 88px, 96px 96px, auto;
      overflow-x: hidden;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      z-index: -2;
      background:
        radial-gradient(ellipse at 18% 12%, rgba(255, 250, 240, 0.85), transparent 34%),
        radial-gradient(ellipse at 82% 8%, rgba(25, 54, 87, 0.12), transparent 30%),
        radial-gradient(ellipse at 50% 100%, rgba(217, 121, 53, 0.16), transparent 45%);
      pointer-events: none;
    }

    body::after {
      content: "☕  ◇  ✦  ▱  ☕  ◌  ✦";
      position: fixed;
      inset: auto -20px 24px auto;
      z-index: -1;
      color: rgba(77, 47, 34, 0.08);
      font: 700 92px/1 Arial, sans-serif;
      letter-spacing: 18px;
      transform: rotate(-8deg);
      pointer-events: none;
      white-space: nowrap;
    }

    button {
      font: inherit;
    }

    .app {
      width: min(1080px, calc(100% - 32px));
      margin: 0 auto;
      padding: 28px 0 18px;
    }

    .hero {
      position: relative;
      display: grid;
      gap: 16px;
      align-items: center;
      justify-items: center;
      min-height: 230px;
      padding: 24px 16px 8px;
      text-align: center;
    }

    .title-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 14px;
      flex-wrap: wrap;
    }
